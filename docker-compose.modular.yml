# =============================================================================
# PRODUCTION / VPS — modular stack (canonical production stack since 2026-08-12)
# =============================================================================
#   sudo docker compose -f docker-compose.modular.yml up -d --build
#
# Design rules (learned from the 2026-08-12 incident — see docs/02-DEPLOYMENT.md):
#   1. Every credential, port and tunable comes from the root .env — nothing
#      sensitive is hardcoded in this file.
#   2. NO env_file on infrastructure containers. Each variable is mapped
#      explicitly so an unrelated .env key can never be injected into a
#      container and change its behavior (this is exactly how the EMQX
#      bootstrap-file crash loop happened).
#   3. Same named volumes as docker-compose.yml (postgres_data, timescale_data,
#      emqx_data, emqx_log): both files operate on ONE database set.
#      NEVER run both stacks at the same time (container-name + port conflicts).
#   4. Host ports are bound to 127.0.0.1 except MQTT :1883 (devices) — Caddy
#      (deploy/Caddyfile.modular) is the only public entry point.
#
# Extra services over the lean docker-compose.yml: auth (:3009), analytics
# (:3006), energy (:3002), climate (:3003), firmware (:3004), ingestor (:3005).
# Caddy routes /api/* to the backend bridge (:8787) and /health to auth (:3009)
# until per-service gateway cutover (docs/01-ARCHITECTURE.md).
#
# The EMQX bootstrap-API-key mechanism (emqx-api-key.conf + emqx-init service)
# was RETIRED on 2026-08-12. The MQTT user persists in the built_in_database
# inside the emqx_data volume; manage users via the EMQX dashboard
# (docs/03-EMQX-MQTT-RECOVERY.md).
# =============================================================================

services:
  # PostgreSQL (user data) — shared volume with docker-compose.yml
  postgres:
    image: postgres:16-alpine
    container_name: selene-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - selene
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # TimescaleDB (telemetry) — shared volume with docker-compose.yml
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: selene-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${TIMESCALE_USER}
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD}
      - POSTGRES_DB=${TIMESCALE_DB}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - selene
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER} -d ${TIMESCALE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EMQX MQTT broker.
  # Auth state (MQTT users) persists in emqx_data — created once, survives
  # rebuilds. Dashboard defaults below only seed on FIRST boot of a fresh
  # emqx_data volume (docs/03-EMQX-MQTT-RECOVERY.md).
  emqx:
    image: emqx/emqx:5.7.0
    container_name: selene-emqx
    restart: unless-stopped
    environment:
      - EMQX_NAME=${EMQX_NAME}
      - EMQX_ALLOW_ANONYMOUS=${EMQX_ALLOW_ANONYMOUS}
      - EMQX_AUTHENTICATION__1__MECHANISM=${EMQX_AUTH_MECHANISM}
      - EMQX_AUTHENTICATION__1__BACKEND=${EMQX_AUTH_BACKEND}
      - EMQX_AUTHENTICATION__1__USER_ID_TYPE=${EMQX_AUTH_USER_ID_TYPE}
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
    ports:
      - "1883:1883"              # MQTT (public — edge devices connect here)
      - "127.0.0.1:18083:18083"  # Dashboard (Caddy: emqx.dankehidayat.my.id)
      - "127.0.0.1:8083:8083"    # MQTT over WebSocket
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - selene

  # Auth Service (:3009) — Caddy /health → localhost:3009
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: selene-auth
    restart: unless-stopped
    environment:
      AUTH_PORT: ${AUTH_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_V2_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: "Selene <onboarding@resend.dev>"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      TOTP_ISSUER: ${TOTP_ISSUER:-Selene}
      ELEVATION_CONFIRMATION: ${ELEVATION_CONFIRMATION:-false}
    ports:
      - "127.0.0.1:${AUTH_PORT}:${AUTH_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - selene

  # Analytics Service (:3006)
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: selene-analytics
    restart: unless-stopped
    environment:
      ANALYTICS_PORT: ${ANALYTICS_PORT:-3006}
      TIMESCALE_URL: postgresql://${TIMESCALE_USER}:${TIMESCALE_PASSWORD}@timescaledb:5432/${TIMESCALE_DB}
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-3006}:${ANALYTICS_PORT:-3006}"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - selene

  # Energy Service (:3002)
  energy:
    build:
      context: .
      dockerfile: services/energy/Dockerfile
    container_name: selene-energy
    restart: unless-stopped
    environment:
      ENERGY_PORT: ${ENERGY_PORT}
      TIMESCALE_URL: postgresql://${TIMESCALE_USER}:${TIMESCALE_PASSWORD}@timescaledb:5432/${TIMESCALE_DB}
    ports:
      - "127.0.0.1:${ENERGY_PORT}:${ENERGY_PORT}"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - selene

  # Climate Service (:3003)
  climate:
    build:
      context: .
      dockerfile: services/climate/Dockerfile
    container_name: selene-climate
    restart: unless-stopped
    environment:
      CLIMATE_PORT: ${CLIMATE_PORT}
      TIMESCALE_URL: postgresql://${TIMESCALE_USER}:${TIMESCALE_PASSWORD}@timescaledb:5432/${TIMESCALE_DB}
    ports:
      - "127.0.0.1:${CLIMATE_PORT}:${CLIMATE_PORT}"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - selene

  # Firmware Service (:3004) — OTA upload + MQTT command
  firmware:
    build:
      context: .
      dockerfile: services/firmware/Dockerfile
    container_name: selene-firmware
    restart: unless-stopped
    environment:
      FIRMWARE_PORT: ${FIRMWARE_PORT}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - "127.0.0.1:${FIRMWARE_PORT}:${FIRMWARE_PORT}"
    depends_on:
      emqx:
        condition: service_started
    networks:
      - selene

  # Ingestor Service (:3005) — MQTT → parser registry → TimescaleDB
  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    container_name: selene-ingestor
    restart: unless-stopped
    environment:
      INGESTOR_PORT: ${INGESTOR_PORT}
      TIMESCALE_URL: postgresql://${TIMESCALE_USER}:${TIMESCALE_PASSWORD}@timescaledb:5432/${TIMESCALE_DB}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC}
    ports:
      - "127.0.0.1:${INGESTOR_PORT}:${INGESTOR_PORT}"
    depends_on:
      emqx:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - selene

  # Backend (Fastify monolith, :8787) — serves the full /api/* surface today
  # (v1 bridge until microservices cut over). RESEND_* / APP_PUBLIC_URL /
  # TOTP_ISSUER come from env_file (apps/backend/.env). Do NOT set empty
  # defaults for them here — Compose environment overrides env_file and would
  # wipe a real API key.
  backend:
    build:
      # Monorepo root required for @selene/shared + @selene/sensors
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: selene-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TIMESCALE_URL=postgresql://${TIMESCALE_USER}:${TIMESCALE_PASSWORD}@timescaledb:5432/${TIMESCALE_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_started
    networks:
      - selene

  # Frontend (React SPA, published on FRONTEND_PORT)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: selene-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - selene

networks:
  selene:
    driver: bridge

volumes:
  postgres_data:
  timescale_data:
  emqx_data:
  emqx_log:
